<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img" aria-label="NetScope animated banner">
  <rect width="320" height="80" rx="12" fill="#0A0B09"/>
  <circle cx="40" cy="40" r="10" fill="#ED673F">
    <animate attributeName="r" values="10;18;10" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="48" font-family="monospace" font-size="26" font-weight="700" fill="#FFFFFF">netscope</text>
  <text x="218" y="48" font-family="monospace" font-size="26" font-weight="900" fill="#ED673F">.</text>
  <rect x="72" y="58" width="0" height="2" fill="#ED673F">
    <animate attributeName="width" values="0;180;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
