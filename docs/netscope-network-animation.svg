<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110" role="img" aria-label="NetScope network animation">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ED673F"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="420" height="110" rx="14" fill="#0A0B09"/>
  <g transform="translate(24,20)">
    <rect x="0" y="30" width="14" height="30" rx="4" fill="url(#bar)">
      <animate attributeName="height" values="30;52;24;44;30" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;8;36;16;30" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="20" width="14" height="40" rx="4" fill="url(#bar)">
      <animate attributeName="height" values="40;22;56;30;40" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;38;4;30;20" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="12" width="14" height="48" rx="4" fill="url(#bar)">
      <animate attributeName="height" values="48;28;60;34;48" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;32;0;26;12" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="26" width="14" height="34" rx="4" fill="url(#bar)">
      <animate attributeName="height" values="34;48;20;40;34" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="26;12;40;20;26" dur="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="132" cy="55" r="6" fill="#10B981">
    <animate attributeName="r" values="6;11;6" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="150" y="62" font-family="monospace" font-size="30" font-weight="800" fill="#FFFFFF">netscope</text>
  <text x="332" y="62" font-family="monospace" font-size="30" font-weight="900" fill="#ED673F">.</text>
  <text x="150" y="84" font-family="monospace" font-size="11" fill="#A1A39B">on-device traffic telemetry</text>
</svg>
